server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Usar DNS interno de Docker para resolver el upstream en tiempo de petición
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Proxy para el backend API
    location /Backend/ {
        set $backend_upstream http://backend:80;
        proxy_pass $backend_upstream/Backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Servir sitemap.xml con el tipo MIME correcto
    location = /sitemap.xml {
        add_header Content-Type application/xml;
        add_header X-Robots-Tag "noindex, nofollow";
        try_files $uri =404;
    }

    # Servir robots.txt con el tipo MIME correcto
    location = /robots.txt {
        add_header Content-Type text/plain;
        try_files $uri =404;
    }

    # Configuración para SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Configuración para favicon (cache más corto)
    location ~* \.(ico)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Configuración para otros archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Configuración de compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
}
